# Onyx Music Player — uso general y desarrollo
# Copia .env.example a .env y ajusta valores antes de iniciar.

name: onyx-music-player

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onyx-backend
    restart: unless-stopped
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
      - onyx-cache:/cache
    environment:
      PORT: ${PORT:-9090}
      MUSIC_DIR: /music
      CACHE_DIR: /cache
      ONYX_USER: ${ONYX_USER:-admin}
      ONYX_PASSWORD: ${ONYX_PASSWORD:-onyx123}
      JWT_SECRET: ${JWT_SECRET:-onyx-change-this-secret-in-production}
    networks:
      - onyx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    container_name: onyx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4000}:80"
    depends_on:
      - backend
    networks:
      - onyx-network

networks:
  onyx-network:
    driver: bridge

volumes:
  onyx-cache:
